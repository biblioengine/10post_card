<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="毎日の発信の報告カードを、手入力で作れるページ">
<title>報告カード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Dela+Gothic+One&family=Roboto+Mono:wght@500;700&family=Archivo+Black&family=Archivo:wght@500;700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 報告カード：手入力だけで作れる単独ページ（このファイル1つで動く） */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --line:#e1e4ec; --fg:#161a24; --muted:#687087;
  --x:#2f62f0; --gold:#f0a800; --hover:#f0f2f8;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-disp:"Dela Gothic One","Noto Sans JP",sans-serif;
  --f-num:"Roboto Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#181c25; --line:#2a303c; --fg:#eceff5; --muted:#9aa3b6;
  --x:#6c90ff; --gold:#ffc53d; --hover:#20252f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#181c25; --line:#2a303c; --fg:#eceff5; --muted:#9aa3b6;
  --x:#6c90ff; --gold:#ffc53d; --hover:#20252f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--x);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--panel)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:10;max-width:calc(100vw - 32px)}

.page{max-width:880px;margin:24px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.ttl{padding:18px 20px 0;margin:0;font-family:var(--f-disp);font-weight:400;font-size:20px;line-height:1.3}
.ttl em{font-style:normal;color:var(--gold)}

.cd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:20px;padding:20px;align-items:start}
.cd canvas{width:100%;height:auto;max-width:100%;border-radius:12px;display:block;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.cd h3{margin:0 0 4px;font-size:16px}
.cd .hint{margin:0 0 14px;font-size:12px;color:var(--muted);line-height:1.6}
.cd label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;margin-bottom:12px}
.cd input{font:inherit;font-family:var(--f-num);font-size:18px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.cd input:focus,.cd textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.cd textarea{font:inherit;font-size:16px;font-weight:400;line-height:1.5;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;resize:vertical;min-height:84px}
.cd .cnt{font-size:11px;font-weight:400;color:var(--muted);text-align:right}
.cd .frow{display:grid;grid-template-columns:62px minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px;margin-bottom:10px;font-size:12px;font-weight:700}
.cd .frow b{color:var(--muted);font-weight:400}
.cd .frow input{font-size:16px;padding:7px 8px}
.cd .prow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.cd .prow .bgl{grid-column:1/-1}
.cd .prow label{margin:0;font-size:11px}
.cd .prow input{font-size:16px;padding:7px 8px}
.cd .bgpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 4px}
.cd .bgl{width:100%;font-size:12px;font-weight:700}
.cd .sw{display:flex;flex-wrap:wrap;gap:6px}
.cd .sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0}
.cd .sw button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
.cd .free{flex-direction:row;align-items:center;gap:6px;margin:0;font-size:12px;font-weight:700}
.cd .bnrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.cd .bnrow[hidden]{display:none}
.cd .bna{flex-direction:row;align-items:center;gap:8px;margin:0;font-size:12px;font-weight:700}
.cd .bna input{width:120px;padding:0;border:0;background:none;accent-color:var(--gold)}
.cd .bnrow:has(#cBn:not(:checked)) .bna{opacity:.4;pointer-events:none}
.cd .bnsw{flex-direction:row;align-items:center;gap:6px;margin:0;font-size:12px;font-weight:700;cursor:pointer}
.cd .bnsw input{width:18px;height:18px;padding:0;margin:0;accent-color:var(--gold);cursor:pointer}
.cd .free input{width:36px;height:30px;padding:0;border-radius:6px;cursor:pointer}
.cd .acts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.cd .acts .btn{width:100%;padding:9px 12px}

/* プロフィール（初回だけ入力。この端末に保存） */
.prof{border:1px solid var(--line);border-radius:10px;margin:0 0 18px;background:var(--bg)}
.prof summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.prof summary::-webkit-details-marker{display:none}
.prof summary::after{content:'▾';margin-left:auto;color:var(--muted);transition:transform .15s}
.prof[open] summary::after{transform:rotate(180deg)}
.prof summary .st{font-size:11px;font-weight:400;color:var(--muted)}
.prof .pb{padding:0 12px 4px}
.prof .pb .hint{margin-bottom:12px}
.cd .prof input{background:var(--panel);font-family:var(--f-body);font-size:16px}
.cd .prof textarea{background:var(--panel);min-height:64px}
.cd .prof input[type=date]{font-family:var(--f-num)}
.imgrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;font-weight:700}
.imgrow .lb{flex:none;width:88px;white-space:nowrap}
.imgrow .pv{flex:none;width:44px;height:44px;border-radius:50%;background:var(--line) center/cover no-repeat;border:1px solid var(--line)}
.imgrow .pv.bn{width:66px;height:22px;border-radius:4px}
.imgrow .pick{position:relative;overflow:hidden;padding:5px 10px;font-size:12px;white-space:nowrap;flex:none}
.imgrow .pick input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0}
.imgrow .rm{white-space:nowrap;border:0;background:none;color:var(--muted);font-size:12px;padding:4px;text-decoration:underline}
.imgrow .rm[hidden]{display:none}
.imgrow .pv{cursor:pointer}
.imgrow .adj{padding:5px 10px;font-size:12px;white-space:nowrap;flex:none}
.imgrow .adj[hidden]{display:none}

/* PC：カードは画面の上に貼りつけたまま、入力欄だけが流れる */
@media (min-width:641px){.cd .cdl{position:sticky;top:16px}}

/* 画像の切り抜き */
.crop{position:fixed;inset:0;z-index:30;background:rgba(8,10,14,.92);display:flex;justify-content:center}
.crop[hidden]{display:none}
.cropbox{width:min(760px,100%);height:100%;display:flex;flex-direction:column}
.cropst{flex:1;min-height:0;position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.cropst.drag{cursor:grabbing}
.cropst canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cropct{flex:none;background:var(--panel);color:var(--fg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0}
.cropct h4{margin:0 0 2px;font-size:15px}
.cropct p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.cropct .zm{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;margin-bottom:12px}
.cropct .zm input{flex:1;accent-color:var(--gold)}
.cropct .zb{width:32px;height:32px;padding:0;font-size:18px;line-height:1}
.cropbt{display:flex;gap:8px}.cropbt .btn{flex:1;padding:10px 12px}

@media (max-width:640px){
  /* スマホ：ページ全体を画面（キーボードを除いた見えている範囲）に合わせて固定し、
     上にカード、下に入力欄。入力欄だけがスクロールするので、文字を打っている間もカード全体が見える */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .page{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;margin:0;border:0;border-radius:0;max-width:none;display:flex;flex-direction:column}
  .ttl{flex:none;padding:10px 14px 0;font-size:16px}
  .cd{flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;padding:0;gap:0}
  .cd .cdl{flex:none;position:relative;z-index:2;background:var(--panel);padding:8px 14px 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center}
  .cd .cdl .bgpick{align-self:stretch}
  .cd canvas{width:auto;height:auto;max-width:100%;max-height:var(--pvh,40vh);margin:0 auto;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.18)}
  .cd .bgpick{margin:8px 0 0;gap:6px}.cd .bgpick .bgl{width:auto;margin-right:2px}
  .cd .sw button{width:24px;height:24px}
  .cd .form{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px))}
  /* キーボードが出ている間は、見出しと背景色の列をしまってカードを大きく見せる */
  body.kb .ttl,body.kb .cd .bgpick{display:none}
}
</style>
</head>
<body>
<div class="page">
  <h1 class="ttl">報告カード</h1>
  <div class="cd">
    <div class="cdl">
      <canvas id="cardCv" width="1080" height="1080" aria-label="報告カードのプレビュー"></canvas>
      <div class="bgpick">
        <span class="bgl">背景の色</span>
        <div class="sw" id="cardSw"></div>
        <label class="free" for="cBg">自由に選ぶ<input type="color" id="cBg" value="#0e1116"></label>
        <span class="bnrow" id="cBnW" hidden><label class="bnsw"><input type="checkbox" id="cBn" checked>ヘッダー画像</label>
          <label class="bna">なじませる<input type="range" id="cBnA" min="0" max="100" step="5" value="100" aria-label="ヘッダー画像を背景色になじませる強さ"></label></span>
      </div>
    </div>
    <div class="form" id="form">
      <details class="prof" id="prof">
        <summary>プロフィール<span class="st" id="profSt"></span></summary>
        <div class="pb">
          <p class="hint">最初に一度だけ入力してください。この端末のブラウザに保存され、次からは入力しなくても入ります。</p>
          <label for="uTitle">カードのタイトル<input id="uTitle" autocomplete="off" maxlength="20" placeholder="例：100DAYS×NOTE（「×」は金色になります）"></label>
          <label for="uSub">サブタイトル<input id="uSub" autocomplete="off" maxlength="30" placeholder="例：HUNDRED DAYS CHALLENGE"></label>
          <div class="imgrow"><span class="lb">アイコン</span><span class="pv" id="avPv"></span>
            <span class="btn pick">選ぶ<input type="file" id="avIn" accept="image/*" aria-label="アイコン画像を選ぶ"></span>
            <button type="button" class="btn adj" id="avAdj" hidden>位置・大きさ</button>
            <button type="button" class="rm" id="avRm" hidden>外す</button></div>
          <div class="imgrow"><span class="lb">ヘッダー画像</span><span class="pv bn" id="bnPv"></span>
            <span class="btn pick">選ぶ<input type="file" id="bnIn" accept="image/*" aria-label="ヘッダー画像を選ぶ"></span>
            <button type="button" class="btn adj" id="bnAdj" hidden>位置・大きさ</button>
            <button type="button" class="rm" id="bnRm" hidden>外す</button></div>
          <label for="uName">名前<input id="uName" autocomplete="off" maxlength="40" placeholder="表示名"></label>
          <label for="uHandle">@ID<input id="uHandle" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" placeholder="@なしで入力"></label>
          <label for="uTag">紹介文<textarea id="uTag" rows="2" maxlength="80" placeholder="名前の下に入るひとこと（2行まで）"></textarea></label>
          <label for="uStart">開始日<input type="date" id="uStart"></label>
          <label for="uGoal">目標日数（空欄なら日数だけ表示）<input id="uGoal" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="例：30"></label>
        </div>
      </details>

      <h3>今日の個人カード</h3>
      <p class="hint">前日と現在のフォロワー数を入れると、増減を自動で計算してカードにします。前日の欄は、前回カードを作ったときの「現在」が自動で入ります。</p>
      <label for="cDate">日付<input type="date" id="cDate"></label>
      <div class="frow"><span>X</span><input id="pX" inputmode="numeric" autocomplete="off" placeholder="前日" aria-label="X 前日"><b>→</b><input id="cX" inputmode="numeric" autocomplete="off" placeholder="現在" aria-label="X 現在"></div>
      <div class="frow"><span>Threads</span><input id="pTh" inputmode="numeric" autocomplete="off" placeholder="前日" aria-label="Threads 前日"><b>→</b><input id="cTh" inputmode="numeric" autocomplete="off" placeholder="現在" aria-label="Threads 現在"></div>
      <div class="frow"><span>note</span><input id="pNote" inputmode="numeric" autocomplete="off" placeholder="前日" aria-label="note 前日"><b>→</b><input id="cNote" inputmode="numeric" autocomplete="off" placeholder="現在" aria-label="note 現在"></div>
      <div class="prow"><span class="bgl">今日の投稿数</span>
        <label for="nX">X<input id="nX" inputmode="numeric" autocomplete="off" placeholder="本"></label>
        <label for="nTh">Threads<input id="nTh" inputmode="numeric" autocomplete="off" placeholder="本"></label>
        <label for="nNote">note<input id="nNote" inputmode="numeric" autocomplete="off" placeholder="本"></label>
      </div>
      <label for="cMsg">ひとこと（今の状況・気持ち・気づきなど）<textarea id="cMsg" rows="3" maxlength="140" placeholder="何も書かないと「ここにメッセージを入力できます」と入ります"></textarea><span class="cnt" id="cMsgN">0 / 140</span></label>
      <div class="acts">
        <button class="btn primary" type="button" id="cardShare" hidden>画像を共有</button>
        <button class="btn primary" type="button" id="cardSave">画像を保存</button>
      </div>
    </div>
  </div>
</div>

<div class="crop" id="crop" hidden role="dialog" aria-modal="true" aria-labelledby="cropH">
  <div class="cropbox">
    <div class="cropst" id="cropSt"><canvas id="cropCv"></canvas></div>
    <div class="cropct">
      <h4 id="cropH">表示する範囲を選ぶ</h4>
      <p>枠の中がカードに入ります。ドラッグで位置、2本指・ホイール・下のつまみで大きさを変えられます。</p>
      <div class="zm"><button type="button" class="btn zb" id="cropMinus" aria-label="縮小">−</button>
        <input type="range" id="cropZ" min="1" max="5" step="0.01" value="1" aria-label="拡大率">
        <button type="button" class="btn zb" id="cropPlus" aria-label="拡大">＋</button></div>
      <div class="cropbt"><button type="button" class="btn" id="cropNo">やめる</button><button type="button" class="btn primary" id="cropOk">決定</button></div>
    </div>
  </div>
</div>

<script>
/* ---------- 保存（この端末のブラウザだけ） ---------- */
const LS={get(k,d){try{const v=localStorage.getItem('rcard:'+k);return v==null?d:v}catch{return d}},
  set(k,v){try{localStorage.setItem('rcard:'+k,v);return true}catch{return false}}};
const dkey=t=>{const d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const todayKey=()=>dkey(Date.now());
const isoDay=t=>`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* プロフィール */
const prof={name:'',handle:'',tag:'',start:'',goal:'',av:'',bn:'',avSrc:'',bnSrc:'',avCrop:null,bnCrop:null,title:'',sub:''};
try{Object.assign(prof,JSON.parse(LS.get('profile','{}')))}catch{}
function saveProf(){
  if(LS.set('profile',JSON.stringify(prof)))return;
  // 入りきらないときは、あとで調整し直すための元画像を手放して、切り抜いた画像だけを残す
  if(prof.avSrc||prof.bnSrc){prof.avSrc='';prof.bnSrc='';if(LS.set('profile',JSON.stringify(prof))){toast('保存の容量が足りないため、元の画像は残せませんでした（調整し直すときは画像を選び直してください）');return}}
  toast('保存できませんでした。画像を小さめのものにしてみてください')}
const uTitle=document.getElementById('uTitle'),uSub=document.getElementById('uSub'),uName=document.getElementById('uName'),uHandle=document.getElementById('uHandle'),uTag=document.getElementById('uTag'),uStart=document.getElementById('uStart'),uGoal=document.getElementById('uGoal');
const cleanHandle=s=>s.trim().replace(/^@+/,'').replace(/\s/g,'');

/* ---------- カードを描く ---------- */
const BN_BLEND=100; // ヘッダー画像を背景色になじませる強さ（初期値）
let cardImg=null,cardBn=null,cardRaf=0,cardBg='#0e1116';
const BG_PRESETS=[['#0e1116','インク'],['#14213d','ネイビー'],['#123629','ディープグリーン'],['#4a1424','ボルドー'],['#2a1c48','パープル'],['#3a3f4a','スレート'],['#7a2e12','テラコッタ'],['#f3f4f6','ホワイト']];
const hexRgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const rgbHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mixHex=(h,to,t)=>{const a=hexRgb(h),b=hexRgb(to);return rgbHex(a.map((v,i)=>v+(b[i]-v)*t))};
const lum=h=>{const [r,g,b]=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function readable(bg,color,fallback,min){return contrast(bg,color)>=min?color:fallback}
function cardPalette(bg){
  // 背景の明るさに合わせて文字色を決め、どの色でも読める濃さを保つ
  const light=contrast(bg,'#151922')>=contrast(bg,'#ffffff');
  const fg=light?'#151922':'#ffffff',to=light?'#000000':'#ffffff';
  let muted=mixHex(bg,to,.5);for(let t=.5;contrast(bg,muted)<3.2&&t<.95;t+=.05)muted=mixHex(bg,to,t);
  const gold=readable(bg,light?'#a86f00':'#f2b632',fg,3);
  return{bg,fg,muted,gold,up:gold,down:readable(bg,light?'#c0392b':'#ff8a8a',fg,3),
    panel:mixHex(bg,to,light?.06:.08),line:mixHex(bg,to,.16)};
}
function setBg(hex,save=true){
  cardBg=hex;document.getElementById('cBg').value=hex;
  document.querySelectorAll('#cardSw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.bg===hex));
  if(save)LS.set('bg',hex);
  redrawCard();
}
document.getElementById('cardSw').innerHTML=BG_PRESETS.map(([h,n])=>`<button type="button" data-bg="${h}" style="background:${h}" aria-label="${n}" title="${n}" aria-pressed="false"></button>`).join('');
document.getElementById('cardSw').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setBg(b.dataset.bg)});
document.getElementById('cBg').addEventListener('input',e=>setBg(e.target.value));
const cv=document.getElementById('cardCv');
const cDate=document.getElementById('cDate'),cMsg=document.getElementById('cMsg'),cMsgN=document.getElementById('cMsgN');
const cIn=['cX','cTh','cNote'].map(id=>document.getElementById(id)),pIn=['pX','pTh','pNote'].map(id=>document.getElementById(id)),nIn=['nX','nTh','nNote'].map(id=>document.getElementById(id));
// カードの日付：入力欄の日付（初期値は今日）。空なら今日
function cardDate(){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(cDate.value);return m?new Date(+m[1],m[2]-1,+m[3]):new Date()}
function startDate(){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(prof.start||'');if(m)return new Date(+m[1],m[2]-1,+m[3]);const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dayNo(){const t=cardDate(),a=new Date(t.getFullYear(),t.getMonth(),t.getDate()),b=startDate();return Math.round((a-b)/864e5)+1}
const digits=i=>i.value.replace(/[^\d]/g,'');
function cardVals(){return cIn.map(digits)}
function prevVals(){return pIn.map(digits)}
function postVals(){return nIn.map(digits)}
function spaced(ctx,text,x,y,sp,align){

function fit(ctx,text,maxW,size,font){let s=size;do{ctx.font=font.replace('#',s);if(ctx.measureText(text).width<=maxW)break;s-=2}while(s>14);return s}

  if(lines.length<maxLines&&cur)lines.push(cur);

const MSG_DEFAULT='ここにメッセージを入力できます',MSG_FONT='500 36px "Zen Kaku Gothic New","Noto Sans JP",sans-serif',MSG_LH=56;

// ひとことを行に分ける（改行はそのまま、長い行は折り返す）
function msgLines(ctx,maxW){

    out.push(cur);

function drawCard(){

  const lines=msgLines(ctx,W-P*2),msgTop=996+44,H=msgTop+36+(lines.length-1)*MSG_LH+P;

  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);

  ctx.textBaseline='alphabetic';ctx.textAlign='left';

  const goal=(prof.goal||'').replace(/[^\d]/g,''),gt=goal?' / '+Number(goal):'';
  ctx.font=`700 40px ${EN}`;const tw=gt?ctx.measureText(gt).width:0;

  const dayW=Math.max(ctx.measureText(String(n)).width+tw,180);

  spaced(ctx,`${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`,R,262,3,'right');

  let ls=150;do{ctx.font=`${LW}${ls}px ${LOGOF}`;if(parts.reduce((w,[s])=>w+ctx.measureText(s).width+6,0)<=logoMax)break;ls-=4}while(ls>30);
  let x=P;ctx.textAlign='left';

  ctx.fillStyle=C.muted;ctx.font=`800 28px ${MIX}`;const subW=spaced(ctx,(prof.sub||'').trim()||'SUBTITLE',P+4,262,8.5);
  ctx.font='30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='left';ctx.fillText('🏆',P+4+subW+14,264);

/* ---------- 画像：選んだ画像を小さくしてこの端末に保存する（比率は変えない） ---------- */
function shrink(file,maxW,maxH){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);
      const sc=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight),w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',.88))};

    img.src=url;
  });
}
function loadImg(src){if(!src)return null;const i=new Image();i.onload=redrawCard;i.onerror=redrawCard;i.src=src;return i}

/* ---------- 切り抜き：枠の中に入る範囲を、ドラッグと拡大縮小で決める ---------- */
// アイコンは丸（正方形）、ヘッダーはカードに敷く範囲と同じ横長の比率
const CROP={av:{ratio:1,round:true,ow:480,oh:480,src:1200},bn:{ratio:1024/294,round:false,ow:1500,oh:Math.round(1500*294/1024),src:2000}};
const cropEl=document.getElementById('crop'),cropSt=document.getElementById('cropSt'),cropCv=document.getElementById('cropCv'),cropZ=document.getElementById('cropZ');
const cs={kind:'',img:null,src:'',z:1,x:0,y:0,L:null}; // x,y：枠の中心からの画像の中心のずれ（枠の幅を1とする）
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function cropLayout(){
  const w=cropSt.clientWidth,h=cropSt.clientHeight,dpr=window.devicePixelRatio||1,r=CROP[cs.kind].ratio,m=Math.min(32,w*.06);
  const fw=Math.min(w-m*2,(h-m*2)*r),fh=fw/r;
  cropCv.width=Math.round(w*dpr);cropCv.height=Math.round(h*dpr);
  cs.L={w,h,dpr,fw,fh,fx:(w-fw)/2,fy:(h-fh)/2};
}
function cropScale(){const L=cs.L,i=cs.img;return Math.max(L.fw/i.naturalWidth,L.fh/i.naturalHeight)*cs.z}
function cropClamp(){
  const L=cs.L,i=cs.img,s=cropScale(),iw=i.naturalWidth*s/L.fw,ih=i.naturalHeight*s/L.fw,fh=L.fh/L.fw;
  cs.x=clamp(cs.x,-(iw-1)/2,(iw-1)/2);cs.y=clamp(cs.y,-(ih-fh)/2,(ih-fh)/2);
}
function cropRect(){ // 画像の表示位置（画面のpx）
  const L=cs.L,i=cs.img,s=cropScale(),w=i.naturalWidth*s,h=i.naturalHeight*s;
  return{x:L.fx+L.fw/2+cs.x*L.fw-w/2,y:L.fy+L.fh/2+cs.y*L.fw-h/2,w,h,s};

function cropDraw(){
  if(!cs.L||!cs.img)return;

  ctx.setTransform(L.dpr,0,0,L.dpr,0,0);ctx.clearRect(0,0,L.w,L.h);
  ctx.imageSmoothingQuality='high';ctx.drawImage(cs.img,R.x,R.y,R.w,R.h);
  // 枠の外を暗くする
  ctx.fillStyle='rgba(8,10,14,.66)';ctx.beginPath();ctx.rect(0,0,L.w,L.h);
  if(CROP[cs.kind].round)ctx.arc(L.fx+L.fw/2,L.fy+L.fh/2,L.fw/2,0,Math.PI*2,true);else ctx.rect(L.fx,L.fy,L.fw,L.fh);
  ctx.fill('evenodd');

  if(CROP[cs.kind].round)ctx.arc(L.fx+L.fw/2,L.fy+L.fh/2,L.fw/2,0,Math.PI*2);else ctx.rect(L.fx,L.fy,L.fw,L.fh);

function cropZoom(z,px,py){ // px,py：その点を中心に拡大縮小（画面のpx）
  const L=cs.L,z0=cs.z;z=clamp(z,1,5);if(z===z0)return;

    cs.x=((px-cx)/L.fw)-((px-cx)/L.fw-cs.x)*k;cs.y=((py-cy)/L.fw)-((py-cy)/L.fw-cs.y)*k}

let cropDone=null;
function openCrop(kind,src,saved){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      Object.assign(cs,{kind,img,src,z:saved?.z||1,x:saved?.x||0,y:saved?.y||0});
      cropEl.hidden=false;document.body.style.overflow='hidden';
      document.getElementById('cropH').textContent=kind==='av'?'アイコンに表示する範囲を選ぶ':'ヘッダーに表示する範囲を選ぶ';
      cropLayout();cropZ.value=cs.z;cropClamp();cropDraw();
      cropDone=res;document.getElementById('cropOk').focus();

function closeCrop(ok){
  if(cropEl.hidden)return;
  let out=null;
  if(ok){const c=CROP[cs.kind],L=cs.L,R=cropRect(),o=document.createElement('canvas');o.width=c.ow;o.height=c.oh;
    const g=o.getContext('2d');g.imageSmoothingQuality='high';
    g.drawImage(cs.img,(L.fx-R.x)/R.s,(L.fy-R.y)/R.s,L.fw/R.s,L.fh/R.s,0,0,c.ow,c.oh);
    out={img:o.toDataURL('image/jpeg',.9),crop:{z:cs.z,x:cs.x,y:cs.y}}}

  const r=cropDone;cropDone=null;r&&r(out);

document.getElementById('cropOk').onclick=()=>closeCrop(true);
document.getElementById('cropNo').onclick=()=>closeCrop(false);
document.getElementById('cropPlus').onclick=()=>cropZoom(cs.z*1.15);
document.getElementById('cropMinus').onclick=()=>cropZoom(cs.z/1.15);
cropZ.addEventListener('input',()=>cropZoom(+cropZ.value));
addEventListener('keydown',e=>{if(!cropEl.hidden&&e.key==='Escape')closeCrop(false)});
addEventListener('resize',()=>{if(!cropEl.hidden){cropLayout();cropClamp();cropDraw()}});
// ドラッグ（1本指・マウス）と、2本指の拡大縮小
{const pts=new Map();let pinch=null;
  const pos=e=>{const r=cropSt.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cropSt.addEventListener('pointerdown',e=>{cropSt.setPointerCapture(e.pointerId);pts.set(e.pointerId,pos(e));cropSt.classList.add('drag');
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cs.z}}});
  cropSt.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pos(e),q=pts.get(e.pointerId);pts.set(e.pointerId,p);
    if(pts.size===1){cs.x+=(p.x-q.x)/cs.L.fw;cs.y+=(p.y-q.y)/cs.L.fw;cropClamp();cropDraw()}
    else if(pts.size===2&&pinch){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
      cs.x+=(p.x-q.x)/2/cs.L.fw;cs.y+=(p.y-q.y)/2/cs.L.fw;
      cropZoom(pinch.z*d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);cropClamp();cropDraw()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)cropSt.classList.remove('drag')};
  cropSt.addEventListener('pointerup',up);cropSt.addEventListener('pointercancel',up);
  cropSt.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);cropZoom(cs.z*Math.exp(-e.deltaY*.0015),p.x,p.y)},{passive:false});
}

[uTitle,uSub,uName,uHandle,uTag].forEach(i=>i.addEventListener('input',()=>{
  prof.title=uTitle.value;prof.sub=uSub.value;prof.name=uName.value;prof.handle=cleanHandle(uHandle.value);prof.tag=uTag.value;saveProf();profState();
  loadFonts().then(redrawCard);redrawCard();
}));
uHandle.addEventListener('change',()=>{uHandle.value=prof.handle});
uStart.addEventListener('input',()=>{prof.start=uStart.value;saveProf();redrawCard()});
uStart.addEventListener('change',()=>{prof.start=uStart.value;saveProf();redrawCard()});
uGoal.addEventListener('input',()=>{prof.goal=uGoal.value.replace(/[^\d]/g,'');saveProf();redrawCard()});
uGoal.addEventListener('change',()=>{uGoal.value=prof.goal});
// 初回（名前か@IDが空）はプロフィールを開いておく
if(!profState())document.getElementById('prof').open=true;

/* ---------- 今日の入力：同じ日なら復元。日が変わっていたら、前回の「現在」を「前日」に入れる ---------- */
{let saved={};try{saved=JSON.parse(LS.get('day','{}'))}catch{}
  const tk=todayKey();
  if(saved.d===tk){pIn.forEach((e,i)=>e.value=saved.p?.[i]||'');cIn.forEach((e,i)=>e.value=saved.c?.[i]||'');nIn.forEach((e,i)=>e.value=saved.n?.[i]||'');cMsg.value=saved.t||''}
  else{pIn.forEach((e,i)=>e.value=(saved.d&&saved.d<tk?(saved.c?.[i]||saved.p?.[i]):'')||'')}
  cMsgN.textContent=`${cMsg.value.length} / 140`;
  cDate.value=isoDay(new Date());
}
[...cIn,...pIn,...nIn,cMsg].forEach(i=>i.addEventListener('input',()=>{
  LS.set('day',JSON.stringify({d:todayKey(),p:prevVals(),c:cardVals(),n:postVals(),t:cMsg.value}));
  redrawCard();
}));
cDate.addEventListener('input',redrawCard);cDate.addEventListener('change',redrawCard);
// 入力した文字のフォントが届いてから描き直す（日本語フォントは使う文字の分だけ読み込まれるため）
cMsg.addEventListener('input',()=>{cMsgN.textContent=`${cMsg.value.length} / 140`;
  document.fonts.load('500 36px "Zen Kaku Gothic New"',cMsg.value||MSG_DEFAULT).then(redrawCard,()=>{})});

/* ---------- 背景色・ヘッダー画像の設定 ---------- */
setBg(LS.get('bg','#0e1116'),false);
document.getElementById('cBn').checked=LS.get('bn','1')!=='0';
document.getElementById('cBnA').value=LS.get('bna',String(BN_BLEND));
document.getElementById('cBnA').addEventListener('input',e=>{LS.set('bna',e.target.value);redrawCard()});
document.getElementById('cBn').addEventListener('change',e=>{LS.set('bn',e.target.checked?'1':'0');redrawCard()});

/* ---------- 保存・共有 ---------- */
function cardFile(cb){
  try{cv.toBlob(b=>{if(!b){toast('画像を作れませんでした');return}
    cb(new File([b],`card_${prof.handle||'card'}_day${dayNo()}.png`,{type:'image/png'}))},'image/png')}
  catch{toast('画像を作れませんでした')}
}
document.getElementById('cardSave').onclick=()=>cardFile(f=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('画像を保存しました');
});
document.getElementById('cardShare').onclick=()=>cardFile(async f=>{try{await navigator.share({files:[f]})}catch{}});
{const probe=new File([new Blob(['x'],{type:'image/png'})],'x.png',{type:'image/png'});
  document.getElementById('cardShare').hidden=!(navigator.canShare&&navigator.canShare({files:[probe]}))}

/* ---------- スマホ：キーボードが出ても、見えている範囲にカードと入力欄を収める ---------- */
{const page=document.querySelector('.page'),form=document.getElementById('form'),mq=matchMedia('(max-width:640px)'),vv=window.visualViewport;
  let full=0;
  function fitView(){
    if(!mq.matches){page.style.top=page.style.height='';document.body.classList.remove('kb');return}
    const h=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0;
    full=Math.max(full,h);const kb=h<full*.78;
    document.body.classList.toggle('kb',kb);
    page.style.top=top+'px';page.style.height=h+'px';
    // カードの高さ：キーボードが出ていても全体が見える大きさにする
    page.style.setProperty('--pvh',Math.round(kb?Math.max(130,h*.44):Math.min(h*.46,520))+'px');
  }
  if(vv){vv.addEventListener('resize',fitView);vv.addEventListener('scroll',fitView)}
  let lastW=innerWidth;addEventListener('resize',()=>{if(innerWidth!==lastW){lastW=innerWidth;full=0}fitView()}); // 向きが変わったときだけ基準の高さを測り直すmq.addEventListener?.('change',fitView);
  fitView();
  // 入力欄を選んだら、その欄が入力エリアの中で見えるようにする（ページ全体は動かさない）
  form.addEventListener('focusin',e=>{if(!mq.matches)return;const el=e.target;
    setTimeout(()=>{const r=el.getBoundingClientRect(),f=form.getBoundingClientRect();
      if(r.top<f.top+8||r.bottom>f.bottom-8)form.scrollTop+=r.top-f.top-Math.max(12,(f.height-r.height)/3)},260)});
}

showImgs();drawCard();loadFonts().then(redrawCard);
</script>
</body>
</html>
